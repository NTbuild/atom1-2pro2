<!doctype html>
<!--
  Jo Mendes — a ring loader that turns into the site's header.
  Project cards lay into a tumbling 3D ring one after another while the counter climbs; at 100% the light rises,
  the camera dives inside the ring and it becomes a row of big curved screens behind the header.
  The ring, the clouds and a fluid warp are drawn with three.js: the screens are curved meshes on one circle, and the
  finished frame is pushed around by a small fluid simulation that scrolling and the pointer stir up.
  Motion runs on damped springs. The photos come from the tweakit gallery; the sky is eggshell with a soft light.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jo Mendes</title>
<link rel="icon" href="assets/img/nav-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F2EB;--ink:#111;--red:#E33131;--gut:clamp(24px,3.4vw,64px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a,button{color:inherit;font:inherit}

#stage{position:fixed;inset:0;overflow:hidden;--fade:1;--ui:0;--ui2:0}
#panel{position:absolute;inset:0;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
#stage.live #panel{cursor:grab;touch-action:none}
#stage.live.dragging #panel{cursor:grabbing}
/* the sky reaches far above the frame and feathers into the dark, so its glow climbs as it rises */
#sky{position:absolute;left:-3%;right:-3%;top:-80%;bottom:-3%;background:#f3efe7;opacity:0;-webkit-mask-image:linear-gradient(transparent,#000 36%);mask-image:linear-gradient(transparent,#000 36%);will-change:transform,opacity}
/* eggshell, with a soft light sitting behind the top of the front card: a sun only in idea */
#skyimg{position:absolute;left:0;right:0;bottom:0;height:calc(100% / 1.83);background:radial-gradient(26% 24% at 50% 24%,#fffdf8,rgba(255,250,240,.7) 40%,rgba(255,250,240,0) 75%),radial-gradient(60% 46% at 50% 26%,rgba(250,230,204,.75),rgba(250,232,208,.3) 45%,rgba(250,232,208,0) 75%),linear-gradient(#f4f0e8,#f6efe4 40%,#f3ece2)}
/* night over the sky at 100%; it lifts as the camera settles */
#dusk{position:absolute;inset:0;background:linear-gradient(180deg,#000 0%,rgba(0,0,0,.88) 26%,rgba(0,0,0,.25) 52%,rgba(0,0,0,0) 70%);pointer-events:none}
/* the ring, the cloud bank and the fluid warp, all in one WebGL canvas */
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the sun flaring over the top of the front card, and bright haze swallowing the cards at the sides */
#flare{position:absolute;inset:0;background:radial-gradient(24% 15% at 50% 23%,rgba(255,252,242,.9),rgba(255,236,206,.3) 45%,rgba(255,232,200,0) 78%);mix-blend-mode:screen;opacity:0;pointer-events:none}
#haze{position:absolute;inset:0;background:linear-gradient(90deg,rgba(250,244,236,.85),rgba(250,244,236,.4) 5%,rgba(250,244,236,0) 13%,rgba(250,244,236,0) 87%,rgba(250,244,236,.4) 95%,rgba(250,244,236,.85));opacity:0;pointer-events:none}

/* chrome */
.counter{position:absolute;z-index:5;left:var(--gut);top:calc(var(--gut) * .7);display:flex;color:#fff;font-weight:600;font-size:clamp(64px,7.4vw,136px);line-height:1;letter-spacing:-.05em;opacity:var(--fade);transform:translateY(calc((1 - var(--fade)) * -12px));pointer-events:none}
.odo{display:inline-flex;font-variant-numeric:tabular-nums}
.col{display:inline-block;height:1em;overflow:hidden}
.strip{display:block;will-change:transform}
.strip span{display:block;height:1em}

.name{position:absolute;z-index:5;left:var(--gut);top:calc(var(--gut) * .7);margin:0;display:flex;align-items:flex-start;font-weight:600;font-size:clamp(56px,6.4vw,120px);line-height:1;letter-spacing:-.05em;white-space:nowrap;opacity:var(--ui);transform:translateY(calc((1 - var(--ui)) * 16px))}
.nav{position:absolute;z-index:5;right:var(--gut);top:calc(var(--gut) * .7 + .9vw);display:flex;align-items:center;gap:clamp(24px,2.6vw,44px);font-size:15px;font-weight:500;opacity:var(--ui);transform:translateY(calc((1 - var(--ui)) * -8px))}
.nav a{text-decoration:none}
.nav .dash{width:26px;height:1.5px;background:var(--ink);position:relative}
.nav .dash::after{content:'';position:absolute;right:6px;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.nav .pill{padding:14px 34px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:600;transition:background .2s,color .2s}
.nav .pill:hover{background:var(--ink);color:var(--paper)}

.foot{position:absolute;z-index:5;left:var(--gut);right:var(--gut);bottom:calc(var(--gut) * .6);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;opacity:var(--ui2);transform:translateY(calc((1 - var(--ui2)) * 14px))}
.foot button{border:0;background:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.foot button:last-child{justify-self:end;text-align:right;align-items:flex-end}
.foot small{font:400 11px/1 'DM Mono',ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
.foot b{font-size:17px;font-weight:500}
.foot .watch{display:flex;text-decoration:none;align-items:center;gap:14px;font-size:17px;font-weight:500}
.foot .watch i{width:26px;height:1.5px;background:var(--ink);position:relative}
.foot .watch i::after{content:'';position:absolute;right:6px;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
/* the screens carry their own type now: the project in front is named for screen readers only */
.title{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#stage:not(.ui) :is(.nav,.foot,.name,.title){visibility:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="panel">
    <div id="sky"><div id="skyimg"></div></div>
    <div id="dusk"></div>
    <canvas id="gl" role="img" aria-label="Projects on a ring. Scroll, drag or use the arrow keys to browse; click the screen at either side to bring it to the front."></canvas>
    <div id="flare" aria-hidden="true"></div>
    <div id="haze" aria-hidden="true"></div>
  </div>

  <div class="counter" aria-hidden="true"><span class="odo" id="odo"></span>%</div>

  <h1 class="name">Jo Mendes</h1>
  <nav class="nav" aria-label="Main"><span class="dash" aria-hidden="true"></span><a href="#work">Our works</a><a href="#about">About</a><a class="pill" href="#contact">Contact</a></nav>

  <p class="title" id="title" aria-live="polite"></p>

  <div class="foot">
    <button id="prev" type="button"><small>Prev</small><b id="prevName"></b></button>
    <a class="watch" id="watch" href="#work">Visit this project <i aria-hidden="true"></i></a>
    <button id="next" type="button"><small>Next</small><b id="nextName"></b></button>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- small helpers ----------
const $ = s => document.querySelector(s);
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rad = d => d * Math.PI / 180;
const eo3 = t => 1 - Math.pow(1 - clamp01(t), 3);
// a damped spring from 0 to 1, ms after it starts: w is how quick, z how much it bounces (lower = more)
const spr = (ms, w = 12, z = 0.6) => {
  const t = ms / 1000; if (t <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
};
// a kick that pushes out, recoils and settles
const recoil = (ms, amp, w = 11, decay = 4.2) => { const t = ms / 1000; return t <= 0 ? 0 : amp * Math.exp(-decay * t) * Math.sin(w * t); };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- the work: a photo, a name and a mean colour for each project ----------
const SITES = [
  ['glass-pavilion', '#4f493d'], ['coastal-studio', '#977c6d'], ['arctic-dawn', '#a1a3bf'], ['concrete-sanctuary', '#87817b'],
  ['desert-house', '#896a4f'], ['cedar-retreat', '#2f2d25'], ['manta-depths', '#1f4a67'], ['stone-courtyard', '#887d6a'],
  ['silver-dunes', '#887c73'], ['limestone-courtyard', '#6a5033'], ['ocean-surface', '#374c5c'], ['terracotta-roofs', '#77695e']
].map(([slug, col]) => [slug, slug.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join(' '), col]);

// ---------- page ----------
const stage = $('#stage'), panel = $('#panel'), sky = $('#sky'), flare = $('#flare'), haze = $('#haze'), dusk = $('#dusk');
const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
let t0 = 0, last = 0, spin = 0, started = false, lastSp = 0, move = 0; // move: 0 at rest, 1 while the ring travels
// the person's hand on the ring: an offset in degrees, a glide velocity, the drag in progress, a card to settle on
const U = { off: 0, vel: 0, drag: null, live: false, tgt: null };

// everything the WebGL layer needs to draw a frame; filled in by ringFrame, read by the module below
const RING = window.__ring = { sites: SITES, ready: false, P: 1, oy: 0, ty: 0, zC: 0, ax: 0, az: 0, sp: 0, vel: 0, move: 0, t: 0, rise: 0, cloudA: 0, live: false, reduced: REDUCED, cards: SITES.map(() => ({ on: false })) };

// odometer: each column springs to its target, so the digits roll past and settle
const odo = $('#odo');
odo.innerHTML = [0, 1, 2].map(() => `<span class="col"><span class="strip">${'01234567890'.split('').map(d => `<span>${d}</span>`).join('')}</span></span>`).join('');
const strips = [...odo.querySelectorAll('.strip')];
const cols = [{ p: 0, v: 0, w: 15 }, { p: 0, v: 0, w: 12 }, { p: 0, v: 0, w: 10 }]; // ones, tens, hundreds
let target = 0;
function stepOdo(dt, snap) {
  const s = Math.min(dt, 40) / 1000;
  cols.forEach((c, i) => {
    const goal = Math.floor(target / Math.pow(10, i));
    if (snap) { c.p = goal; c.v = 0; }
    else { c.v += (c.w * c.w * (goal - c.p) - 2 * c.w * c.v) * s; c.p = Math.min(c.p + c.v * s, goal); } // critically damped: rolls up and stops, never past the target
    const d = ((c.p % 10) + 10) % 10;
    strips[2 - i].style.transform = `translateY(${-d}em)`;
  });
  strips[0].parentNode.style.display = cols[2].p > 0.4 ? '' : 'none'; // no leading zero: the 1 shows up as it rolls in
}

// ---------- the ring ----------
const G = { N: SITES.length, GAP: 90, T0: 260, guard: 0 };
G.STEP = 360 / G.N;
G.Tland = G.T0 + (G.N - 1) * G.GAP + 460; G.Tbreath = G.Tland - 40; G.Trev = G.Tland + 300; G.Tdive = G.Trev + 700;

function ringFrame(t, dt) {
  const vw = innerWidth, vh = innerHeight, vmin = Math.min(vw, vh), N = G.N;
  const P = vw * 1.58;
  const eye = 0.34 * spr(t - G.Tdive, 4.2, 0.86);                      // once inside, the eye sits low: the row bends upward to the sides
  const dg = spr(t - G.Tdive, 4.2, 0.86);
  const cw0 = vmin * 0.13, ch0 = cw0 * 9 / 16, R0 = N * cw0 * 1.3 / (2 * Math.PI);
  const cw1 = vw * 0.3, ch1 = cw1 * 9 / 16, R1 = N * cw1 * 1.05 / (2 * Math.PI); // desktop-size, close together
  const D = cw1 * P / (vw * 0.5);                                        // the card in front fills half the width, its neighbours bleed off
  const breath = 1 + recoil(t - G.Tbreath, 0.07, 10, 4);
  const zC = lerp(-200, P + R1 - D, dg) - move * D * 0.12;              // ends inside the ring; pulls back a touch while it travels
  // tipped back a little once inside: the sides sweep up
  const ax = lerp(-24 + 3 * Math.sin(t / 1300), 7, dg) - mouse.y * 1.5 * dg, az = lerp(-15 + 2 * Math.cos(t / 1700), 0, dg);
  spin += lerp(-40, 0, dg) * Math.min(dt, 64) / 1000;                    // tumbling while it builds, still once it lands
  const sp = spin + U.off + mouse.x * 3 * dg; U.live = t > G.Tdive + 900;
  const vel = (sp - lastSp) / Math.max(1, dt) * 1000; lastSp = sp;
  move += (clamp01((Math.abs(vel) - 4) / 90) * (U.live ? 1 : 0) - move) * (1 - Math.exp(-dt / 120)); // eases in and out of a move
  const settled = eo3((t - G.Tdive - 1500) / 1100);                    // the ring has come to rest
  const tyRaw = lerp(0, vh * 0.01, dg) + eye * vh * (1 - D / P) - R1 * Math.sin(rad(7)) * dg;
  Object.assign(RING, { P, oy: eye * vh, ty: tyRaw + G.guard, zC, ax, az, sp, vel: U.live ? vel : 0, move, t, live: U.live, ready: true });
  const cX = Math.cos(rad(ax)), sX = Math.sin(rad(ax)), cZ = Math.cos(rad(az)), sZ = Math.sin(rad(az));
  let landed = 0;
  for (let k = 0; k < N; k++) {
    const c = RING.cards[k], e = t - (G.T0 + k * G.GAP);
    if (e <= 0) { c.on = false; continue; }
    if (e > 300) landed++;
    const lay = spr(e, 12.5, 0.55), f = spr(e, 11, 0.68);                 // comes in from outside, turned, and springs into its slot
    const dk = spr(t - G.Tdive - k * 10, 4.4, 0.8);                      // the dive ripples around the ring
    const R = lerp(R0 * breath, R1, dk), cw = lerp(cw0, cw1, dk), ch = lerp(ch0, ch1, dk), r = R + (1 - lay) * 120, th = k * G.STEP;
    const q = rad(th + sp); let x = r * Math.sin(q), y = 0, z = r * Math.cos(q);
    [x, y] = [x * cZ - y * sZ, x * sZ + y * cZ]; [y, z] = [y * cX - z * sX, y * sX + z * cX];
    const alpha = Math.min(clamp01(e / 140), clamp01((P - (z + zC) - 0.22 * P) / (0.2 * P))); // fade cards before they reach the camera
    // every screen bends on the ring's own circle; glare once settled, strongest in front of the sun
    Object.assign(c, { on: alpha > 0.01, th, r, cw, ch, f, s: 0.55 + 0.45 * lay, alpha, rad: Math.max(3, cw * 0.016), glare: settled * Math.pow(clamp01(-z / r), 6) });
  }
  // drops at once when a top edge would reach the header, eases back up when the pointer lets it
  const want = clearance(vw, vh, P, eye * vh, tyRaw, zC, ax, az, sp) * dg;
  G.guard = want > G.guard ? want : G.guard + (want - G.guard) * (1 - Math.exp(-dt / 260));
  RING.ty = tyRaw + G.guard;
  target = landed >= N ? 100 : Math.round(Math.floor(landed / 2) * 2 / N * 100); // the counter moves in chunks
  const ts = t - G.Trev;
  const rise = spr(ts + 120, 2.4, 0.96);                                 // the light and the clouds come up from below the frame
  RING.rise = rise; RING.cloudA = eo3((ts - 300) / 900);
  sky.style.opacity = eo3((ts + 120) / 600);
  flare.style.opacity = settled; haze.style.opacity = dg;
  $('#title').style.opacity = settled * Math.pow(1 - move, 3);
  sky.style.transform = `translate(${-mouse.x * 10}px,${(1 - rise) * vh * 0.8 - mouse.y * 6}px) scale(${1.1 - 0.1 * rise})`;
  dusk.style.opacity = 1 - eo3((ts - 700) / 1500);                       // the dark lifts behind them
  stage.style.setProperty('--fade', 1 - eo3((t - G.Tdive - 200) / 380));
  const k = d => eo3((t - G.Tdive - 900 - d) / 700);
  stage.style.setProperty('--ui', k(0)); stage.style.setProperty('--ui2', k(180));
  stage.classList.toggle('ui', t > G.Tdive + 800);
  labels(sp);
}

// the screens stay clear of the header: no top edge may rise above SAFE.y (just under the wordmark and nav)
const SAFE = { y: 0 };
function measureSafe() { const n = $('.name'); SAFE.y = n.offsetTop + n.offsetHeight + 20; RING.band = SAFE.y / innerHeight; }
// how far the ring must drop (world units) so every top edge stays below SAFE.y, projected as the WebGL camera draws it
function clearance(vw, vh, P, oy, ty, zC, ax, az, sp) {
  const cX = Math.cos(rad(-ax)), sX = Math.sin(rad(-ax)), cZ = Math.cos(rad(-az)), sZ = Math.sin(rad(-az));
  let need = 0;
  for (const c of RING.cards) {
    if (!c.on || c.alpha < 0.05) continue;
    const half = c.cw / c.r / 2;
    for (let i = 0; i <= 4; i++) {                                     // five points along the top edge
      const a = rad(c.th + sp) + (i / 2 - 1) * half;
      let x = c.r * Math.sin(a), y = c.ch / 2, z = c.r * Math.cos(a);
      [x, y] = [x * cZ - y * sZ, x * sZ + y * cZ]; [y, z] = [y * cX - z * sX, y * sX + z * cX];
      const dz = P - (z + zC); if (dz < 1) continue;
      const sx = vw / 2 + P * x / dz; if (sx < -40 || sx > vw + 40) continue;
      const sy = vh / 2 + oy - P * (y - ty + oy) / dz;
      need = Math.max(need, (SAFE.y - sy) * dz / P);
    }
  }
  return need;
}

// the project facing you, and its neighbours for prev / next
const front = sp => (((Math.round((180 - sp) / G.STEP)) % G.N) + G.N) % G.N; // from inside: the screen on the far wall faces you
let shown = -1;
function labels(sp) {
  const f = front(sp); if (f === shown) return; shown = f;
  const name = k => SITES[((k % G.N) + G.N) % G.N][1];
  $('#prevName').textContent = name(f + 1); $('#nextName').textContent = name(f - 1);
  $('#watch').setAttribute('aria-label', `Visit ${name(f)}`); $('#title').textContent = name(f);
}

// ---------- loop, controls ----------
function frame(now) {
  requestAnimationFrame(frame);
  if (!started) return;
  const dt = Math.min(64, now - last); last = now;
  mouse.x += (mouse.tx - mouse.x) * 0.06; mouse.y += (mouse.ty - mouse.y) * 0.06;
  stepUser(dt);
  ringFrame(now - t0, dt);
  stage.classList.toggle('live', U.live);
  stepOdo(dt, false);
}
function start() {
  spin = 0; target = 0; last = performance.now(); G.guard = 0; measureSafe();
  U.off = 0; U.vel = 0; U.drag = null; U.live = false; U.tgt = null; stage.classList.remove('dragging');
  t0 = REDUCED ? last - 20000 : last; // reduced motion: straight to the header
  stepOdo(0, true);
  RING.cards.forEach(c => { c.on = false; });
}
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'r' && !e.metaKey && !e.ctrlKey) start(); });
addEventListener('pointermove', e => { mouse.tx = e.clientX / innerWidth * 2 - 1; mouse.ty = e.clientY / innerHeight * 2 - 1; });
addEventListener('resize', measureSafe);

// ---------- turning the ring by hand ----------
// the ring rides a spring toward a project: it swings there quickly, overshoots a touch and settles.
// a flick carries its momentum into the project it is heading for
const SPRING = { w: 8.5, z: 0.58 };
const slot = a => 180 + Math.round((a - 180) / G.STEP) * G.STEP;      // the nearest angle with a project square in front
function stepUser(dt) {
  if (U.drag) { U.vel *= Math.exp(-dt / 140); return; }
  const s = Math.min(dt, 34) / 1000, sp = spin + U.off;
  if (!U.live) { U.off += U.vel * s; U.vel *= Math.exp(-dt / 420); return; }
  if (U.tgt == null) U.tgt = slot(sp + U.vel * 0.16);                  // where the flick would carry it
  U.vel += (SPRING.w * SPRING.w * (U.tgt - sp) - 2 * SPRING.z * SPRING.w * U.vel) * s;
  U.off += U.vel * s;
}
const go = d => { // d projects to the right (+) or left (-)
  if (!U.live) return; const base = U.tgt ?? slot(spin + U.off), to = base + d * G.STEP;
  if (Math.abs(to - (spin + U.off)) > G.STEP * 2.2) return; U.tgt = to;
};
const degPerPx = () => -90 / Math.max(320, panel.clientWidth); // a full-width drag turns the ring 90°
panel.addEventListener('pointerdown', e => {
  if (!U.live || e.button !== 0) return;
  U.drag = { id: e.pointerId, x: e.clientX, x0: e.clientX, t: performance.now(), moved: false }; U.vel = 0; U.tgt = null;
  try { panel.setPointerCapture(e.pointerId); } catch (err) {}
  stage.classList.add('dragging');
});
panel.addEventListener('pointermove', e => {
  const d = U.drag; if (!d || e.pointerId !== d.id) return;
  const now = performance.now(), deg = (e.clientX - d.x) * degPerPx();
  if (Math.abs(e.clientX - d.x0) > 4) d.moved = true;
  U.off += deg; U.vel = Math.max(-540, Math.min(540, U.vel * 0.6 + deg / Math.max(16, now - d.t) * 1000 * 0.4));
  d.x = e.clientX; d.t = now;
});
const endDrag = e => {
  const d = U.drag; if (!d || e.pointerId !== d.id) return;
  if (performance.now() - d.t > 90) U.vel = 0; // held still before letting go: no flick
  U.drag = null; U.tgt = null; stage.classList.remove('dragging');
  if (!d.moved && e.type === 'pointerup') { // a click on a side screen brings it to the front
    const x = e.clientX / innerWidth;
    if (x < 0.2) go(-1); else if (x > 0.8) go(1);
  }
};
panel.addEventListener('pointerup', endDrag); panel.addEventListener('pointercancel', endDrag);
let wheelAt = 0, wheelSum = 0;
addEventListener('wheel', e => { // one scroll gesture, one project: a trackpad swipe's stream of events counts once
  if (!U.live) return;
  e.preventDefault();
  const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * (e.deltaMode === 1 ? 16 : 1), now = performance.now();
  if (now - wheelAt < 380) { wheelAt = now - 200; return; }           // the tail of the same swipe: swallow it
  wheelSum += d; if (Math.abs(wheelSum) < 30) return;
  wheelAt = now; go(wheelSum > 0 ? 1 : -1); wheelSum = 0;          // a fresh swipe while it still travels queues the next project
}, { passive: false });
addEventListener('keydown', e => { if (U.live && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); go(e.key === 'ArrowRight' ? 1 : -1); } });
$('#prev').addEventListener('click', () => go(-1));
$('#next').addEventListener('click', () => go(1));

// fonts first, then go
const fonts = Promise.all([`600 40px 'Inter Tight'`, `500 40px 'Inter Tight'`, `400 20px 'DM Mono'`].map(f => document.fonts.load(f)));
Promise.race([fonts, new Promise(r => setTimeout(r, 2500))]).then(() => {
  started = true;
  start();
});
requestAnimationFrame(frame);
})();
</script>
<script type="module">
// the WebGL layer: the ring of curved screens, the cloud bank in front of it, and a fluid warp over the finished frame
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

const RING = window.__ring, REDUCED = RING.reduced;
const rnd = (() => { let s = 99; return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; })();
const range = (a, b) => a + (b - a) * rnd();
const D2R = Math.PI / 180;

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;  // photos and puffs pass straight through, no colour conversion
const loader = new THREE.TextureLoader();
const FULL = new THREE.PlaneGeometry(2, 2);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ---------- the ring: one curved mesh per project, bent on the ring's circle in the vertex shader ----------
const CARD_VS = `
uniform float uR, uArc, uW, uH, uMove, uTime, uK;
varying vec2 vUv;
void main() {
  vUv = uv;
  float phi = (0.5 - uv.x) * uArc;                          // across the screen, around the ring
  vec3 p = vec3(uR * sin(phi), (uv.y - 0.5) * uH, uR * (cos(phi) - 1.0));
  vec3 out_ = normalize(vec3(p.x, 0.0, p.z + uR));          // away from the ring's centre
  p += out_ * uMove * uW * 0.018 * sin(uv.x * 4.4 + uTime / 160.0 + uK); // a soft ripple while it travels
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;
const CARD_FS = `
uniform sampler2D uMap; uniform vec3 uColor; uniform float uLoaded, uAlpha, uGlare, uRad, uW, uH, uTime, uK, uMotion; uniform vec4 uFit;
varying vec2 vUv;
float box(vec2 p, vec2 b, float r) { vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
void main() {
  float d = box((vUv - 0.5) * vec2(uW, uH), vec2(uW, uH) * 0.5, uRad);  // rounded corners, in pixels
  float aa = fwidth(d), mask = 1.0 - smoothstep(-aa, aa, d);
  if (mask <= 0.0) discard;
  // the picture on the tube: bulging a touch, fitted to the screen, with a colour fringe
  vec2 q = vUv - 0.5, t = (0.5 + q * (1.0 + 0.32 * dot(q, q))) * uFit.xy + uFit.zw, fr = vec2(1.3 / uW * uFit.x, 0.0);
  vec3 col = mix(uColor, vec3(texture2D(uMap, t + fr).r, texture2D(uMap, t).g, texture2D(uMap, t - fr).b), uLoaded);
  // phosphor stripes and scanlines, faded out where they would shimmer (a small, far screen)
  float sx = vUv.x * uW / 2.4, sy = vUv.y * uH / 3.0;
  float kx = 1.0 - smoothstep(0.3, 0.6, fwidth(sx)), ky = 1.0 - smoothstep(0.3, 0.6, fwidth(sy));
  col *= mix(vec3(1.0), 0.78 + 0.22 * cos(6.2832 * (sx + vec3(0.0, 0.333, 0.667))), kx) * mix(1.0, 0.84 + 0.16 * cos(6.2832 * sy), ky) * 1.18;
  // darker corners, a slow rolling band, a faint flicker and a sheen on the glass
  col *= mix(0.6, 1.0, 1.0 - smoothstep(0.7, 1.45, length(q * 2.0)));
  col *= 1.0 + uMotion * (0.06 * exp(-pow((fract(vUv.y - uTime / 3500.0 + uK * 0.21) - 0.5) * 9.0, 2.0)) - 0.015 + 0.015 * sin(uTime * 0.05 + uK * 3.0));
  col += 0.035 * (1.0 - smoothstep(0.0, 0.22, abs(q.x + q.y * 0.6 + 0.16)));
  float top = 1.0 - vUv.y, g = uGlare * mix(0.8, 0.22, smoothstep(0.0, 0.12, top)) * (1.0 - smoothstep(0.12, 0.32, top));
  col = 1.0 - (1.0 - col) * (1.0 - vec3(1.0, 0.95, 0.85) * g);  // the sun's glare, screened over the top of the glass
  gl_FragColor = vec4(col, uAlpha * mask);
}`;
const ringScene = new THREE.Scene(), ringCam = new THREE.PerspectiveCamera(30, 1, 1, 50000), ringGroup = new THREE.Group();
ringGroup.rotation.order = 'XZY'; ringScene.add(ringGroup);
const cardGeo = new THREE.PlaneGeometry(1, 1, 48, 1);
// the clips the screens play: four videos shared round the ring (cover-fitted; the square one sits whole on its red)
const CLIPS = [['milton-glaser', 'contain'], ['you-gonna', 'cover'], ['comme', 'cover'], ['featured-template', 'cover']].map(([name, fit]) => {
  const v = document.createElement('video');
  v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.preload = 'auto';
  v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.src = `assets/tv/${name}.mp4`;
  const c = { v, fit, aspect: 16 / 9, ready: false, tex: new THREE.VideoTexture(v) };
  c.tex.minFilter = THREE.LinearFilter; c.tex.generateMipmaps = false;
  v.addEventListener('loadeddata', () => { c.aspect = v.videoWidth / v.videoHeight; c.ready = true; });
  const play = () => v.play().catch(() => {}); play();
  addEventListener('pointerdown', play, { once: true });               // in case the browser held autoplay back
  return c;
});
// how the clip sits on a screen of aspect a: scale and offset into its texture
const fitOf = (c, a) => { let sx = 1, sy = 1; if ((c.aspect > a) === (c.fit === 'cover')) sx = a / c.aspect; else sy = c.aspect / a; return [sx, sy, (1 - sx) / 2, (1 - sy) / 2]; };
const cards = RING.sites.map((site, k) => {
  const clip = CLIPS[k % CLIPS.length];
  const u = { uMap: { value: clip.tex }, uColor: { value: new THREE.Color('#141414') }, uLoaded: { value: 0 }, uAlpha: { value: 1 }, uGlare: { value: 0 },
    uRad: { value: 4 }, uW: { value: 1 }, uH: { value: 1 }, uR: { value: 1 }, uArc: { value: 0.1 }, uMove: { value: 0 }, uTime: { value: 0 }, uK: { value: k },
    uFit: { value: new THREE.Vector4(1, 1, 0, 0) }, uMotion: { value: REDUCED ? 0 : 1 } };
  const mesh = new THREE.Mesh(cardGeo, new THREE.ShaderMaterial({ uniforms: u, vertexShader: CARD_VS, fragmentShader: CARD_FS, transparent: true, side: THREE.DoubleSide, extensions: { derivatives: true } }));
  mesh.frustumCulled = false;
  const pivot = new THREE.Object3D(), seat = new THREE.Object3D(); seat.rotation.order = 'YXZ';
  pivot.add(seat); seat.add(mesh); ringGroup.add(pivot);
  return { u, mesh, pivot, seat, clip };
});

// the ring's numbers come from the page script in CSS terms (pixels, y down, perspective P with its origin oy below centre)
function placeRing(vw, vh) {
  const R = RING;
  ringCam.fov = 2 * Math.atan(vh / 2 / R.P) / D2R; ringCam.aspect = vw / vh; ringCam.position.set(0, -R.oy, R.P);
  ringCam.updateProjectionMatrix();
  ringCam.projectionMatrix.elements[9] = 2 * R.oy / vh;               // the vanishing point sits oy below the middle, like perspective-origin
  ringCam.projectionMatrixInverse.copy(ringCam.projectionMatrix).invert();
  ringGroup.position.set(0, -R.ty, R.zC);
  ringGroup.rotation.set(-R.ax * D2R, R.sp * D2R, -R.az * D2R);
  cards.forEach((c, k) => {
    const s = R.cards[k]; c.mesh.visible = !!s.on; if (!s.on) return;
    c.pivot.rotation.y = s.th * D2R; c.seat.position.z = s.r;
    c.seat.rotation.set(-40 * (1 - s.f) * D2R, -70 * (1 - s.f) * D2R, 0); c.seat.scale.setScalar(s.s);
    const u = c.u; u.uW.value = s.cw; u.uH.value = s.ch; u.uR.value = s.r; u.uArc.value = s.cw / s.r; u.uAlpha.value = s.alpha;
    u.uGlare.value = s.glare; u.uRad.value = s.rad; u.uMove.value = R.move; u.uTime.value = R.t;
    u.uLoaded.value = c.clip.ready ? 1 : 0; u.uFit.value.set(...fitOf(c.clip, s.cw / s.ch));
  });
}

// ---------- the cloud bank: puffs cut from a sunrise photo, each drifting, bobbing and breathing on its own ----------
const cloudScene = new THREE.Scene(), cloudCam = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const PUFF = [1, 2, 4, 5, 6, 7].map(n => loader.load(`assets/sky/puff-${n}.png`));
const ASPECT = [264 / 580, 200 / 330, 260 / 366, 150 / 280, 180 / 296, 224 / 460]; // height / width of each cut-out
const puffs = [];
for (let row = 0; row < 4; row++) {                       // a few rows of evenly spread puffs, so the bank reads as one body
  const d = 3.9 + row * 1.05, span = d * 0.8 + 1.8, n = 8 + row, gap = span * 2 / n;
  for (let i = 0; i < n; i++) {
    const k = Math.floor(rnd() * PUFF.length), w = range(4, 5.4) * d / 5, h = w * ASPECT[k] * 1.1;
    const o = { x: -span + gap * (i + 0.5) + range(-0.25, 0.25) * gap, y: -(range(0.27, 0.3) * d + w * 0.25), z: -d - range(0, 0.4), w, h };
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: PUFF[k], transparent: true, depthWrite: false, rotation: range(-0.05, 0.05) }));
    cloudScene.add(sp);
    puffs.push({ sp, o, vx: range(0.04, 0.18), ph: rnd() * 6.3, bob: range(0.25, 0.6), turn: range(-0.025, 0.025), br: range(0.12, 0.3) });
  }
}
let cloudT = 0, camX = 0, mx = 0;
function placeClouds(vw, vh, dt) {
  if (!REDUCED) cloudT += dt;
  camX += (mx * 0.25 - camX) * 0.04; cloudCam.position.x = camX;
  cloudCam.aspect = vw / vh;
  cloudCam.setViewOffset(vw, vh, 0, vh * 0.155 - (1 - RING.rise) * vh * 0.8, vw, vh); // horizon at 34.5%; rises with the light
  for (const p of puffs) {
    const { sp, o } = p, bound = Math.abs(o.z) * 0.85 + 7;
    if (!REDUCED) { o.x += p.vx * dt; if (o.x > bound) o.x = -bound; sp.material.rotation += p.turn * 0.3 * dt; } // drifts with the wind, wraps round
    const breath = 1 + Math.sin(cloudT * p.br + p.ph) * 0.03;
    sp.position.set(o.x, o.y + Math.sin(cloudT * p.bob + p.ph) * 0.06 * o.h / 4, o.z);  // bobs on its own beat
    sp.scale.set(o.w * breath, o.h * (2 - breath), 1);                                   // and breathes
    sp.material.opacity = RING.cloudA;
  }
}

// ---------- the fluid: a small stable-fluids simulation whose velocity warps the finished frame ----------
const QUAD_VS = `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const pass = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: QUAD_VS, fragmentShader: fs, uniforms, depthTest: false, depthWrite: false });
const SPLAT = pass(`uniform sampler2D uTarget; uniform vec2 uPoint, uForce; uniform float uRadius, uAspect; varying vec2 vUv;
  void main() { vec2 p = vUv - uPoint; p.x *= uAspect; gl_FragColor = texture2D(uTarget, vUv) + vec4(uForce * exp(-dot(p, p) / uRadius), 0.0, 0.0); }`,
  { uTarget: { value: null }, uPoint: { value: new THREE.Vector2() }, uForce: { value: new THREE.Vector2() }, uRadius: { value: 0.003 }, uAspect: { value: 1 } });
const ADVECT = pass(`uniform sampler2D uVel; uniform vec2 uTexel; uniform float uDt, uDiss; varying vec2 vUv;
  void main() { vec2 c = vUv - uDt * texture2D(uVel, vUv).xy * uTexel; gl_FragColor = uDiss * texture2D(uVel, c); }`,
  { uVel: { value: null }, uTexel: { value: new THREE.Vector2() }, uDt: { value: 0.016 }, uDiss: { value: 0.98 } });
const DIVERGE = pass(`uniform sampler2D uVel; uniform vec2 uTexel; varying vec2 vUv;
  void main() { float l = texture2D(uVel, vUv - vec2(uTexel.x, 0.0)).x, r = texture2D(uVel, vUv + vec2(uTexel.x, 0.0)).x;
    float b = texture2D(uVel, vUv - vec2(0.0, uTexel.y)).y, t = texture2D(uVel, vUv + vec2(0.0, uTexel.y)).y; gl_FragColor = vec4(0.5 * (r - l + t - b), 0.0, 0.0, 1.0); }`,
  { uVel: { value: null }, uTexel: { value: new THREE.Vector2() } });
const PRESSURE = pass(`uniform sampler2D uP, uDiv; uniform vec2 uTexel; varying vec2 vUv;
  void main() { float l = texture2D(uP, vUv - vec2(uTexel.x, 0.0)).x, r = texture2D(uP, vUv + vec2(uTexel.x, 0.0)).x;
    float b = texture2D(uP, vUv - vec2(0.0, uTexel.y)).x, t = texture2D(uP, vUv + vec2(0.0, uTexel.y)).x;
    gl_FragColor = vec4((l + r + b + t - texture2D(uDiv, vUv).x) * 0.25, 0.0, 0.0, 1.0); }`,
  { uP: { value: null }, uDiv: { value: null }, uTexel: { value: new THREE.Vector2() } });
const GRADIENT = pass(`uniform sampler2D uP, uVel; uniform vec2 uTexel; varying vec2 vUv;
  void main() { float l = texture2D(uP, vUv - vec2(uTexel.x, 0.0)).x, r = texture2D(uP, vUv + vec2(uTexel.x, 0.0)).x;
    float b = texture2D(uP, vUv - vec2(0.0, uTexel.y)).x, t = texture2D(uP, vUv + vec2(0.0, uTexel.y)).x;
    gl_FragColor = vec4(texture2D(uVel, vUv).xy - 0.5 * vec2(r - l, t - b), 0.0, 1.0); }`,
  { uP: { value: null }, uVel: { value: null }, uTexel: { value: new THREE.Vector2() } });
const FADE = pass(`uniform sampler2D uTex; uniform float uK; varying vec2 vUv; void main() { gl_FragColor = uK * texture2D(uTex, vUv); }`, { uTex: { value: null }, uK: { value: 0.8 } });
// the warp: each pixel of the frame is fetched from where the fluid has pushed it, colours split a little where it moves fast
const WARP = pass(`uniform sampler2D uScene, uVel; uniform float uStrength, uBand; varying vec2 vUv;
  void main() {
    vec2 off = texture2D(uVel, vUv).xy * uStrength * smoothstep(uBand, uBand + 0.05, 1.0 - vUv.y); // still in the header band
    vec4 c = texture2D(uScene, vUv - off);
    c.r = texture2D(uScene, vUv - off * 1.12).r; c.b = texture2D(uScene, vUv - off * 0.88).b;
    gl_FragColor = c;
  }`, { uScene: { value: null }, uVel: { value: null }, uStrength: { value: 0.00012 }, uBand: { value: 0 } });
const quad = new THREE.Mesh(FULL, WARP), quadScene = new THREE.Scene(); quad.frustumCulled = false; quadScene.add(quad);
const draw = (mat, target) => { quad.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, ortho); };

const SIM = 128, rtOpts = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping };
let velA, velB, prsA, prsB, div, frameRT, simW = SIM, simH = SIM;
const texel = new THREE.Vector2();
function makeTargets(vw, vh) {
  [velA, velB, prsA, prsB, div, frameRT].forEach(t => t && t.dispose());
  simH = SIM; simW = Math.round(SIM * vw / vh); texel.set(1 / simW, 1 / simH);
  velA = new THREE.WebGLRenderTarget(simW, simH, rtOpts); velB = velA.clone(); prsA = velA.clone(); prsB = velA.clone(); div = velA.clone();
  const pr = renderer.getPixelRatio();
  frameRT = new THREE.WebGLRenderTarget(Math.round(vw * pr), Math.round(vh * pr), { samples: 4 }); // the whole frame, before the warp
}
const splats = [];
const splat = (x, y, fx, fy, r = 0.003) => splats.push([x, y, fx, fy, r]);
function stepFluid(dt) {
  for (const [x, y, fx, fy, r] of splats.splice(0)) {
    Object.assign(SPLAT.uniforms.uPoint.value.set(x, y)); SPLAT.uniforms.uForce.value.set(fx, fy);
    SPLAT.uniforms.uRadius.value = r; SPLAT.uniforms.uAspect.value = simW / simH; SPLAT.uniforms.uTarget.value = velA.texture;
    draw(SPLAT, velB); [velA, velB] = [velB, velA];
  }
  ADVECT.uniforms.uVel.value = velA.texture; ADVECT.uniforms.uTexel.value.copy(texel); ADVECT.uniforms.uDt.value = dt;
  ADVECT.uniforms.uDiss.value = Math.pow(0.965, dt * 60);              // it calms down within a second or so
  draw(ADVECT, velB); [velA, velB] = [velB, velA];
  DIVERGE.uniforms.uVel.value = velA.texture; DIVERGE.uniforms.uTexel.value.copy(texel); draw(DIVERGE, div);
  FADE.uniforms.uTex.value = prsA.texture; draw(FADE, prsB); [prsA, prsB] = [prsB, prsA];
  PRESSURE.uniforms.uDiv.value = div.texture; PRESSURE.uniforms.uTexel.value.copy(texel);
  for (let i = 0; i < 16; i++) { PRESSURE.uniforms.uP.value = prsA.texture; draw(PRESSURE, prsB); [prsA, prsB] = [prsB, prsA]; }
  GRADIENT.uniforms.uP.value = prsA.texture; GRADIENT.uniforms.uVel.value = velA.texture; GRADIENT.uniforms.uTexel.value.copy(texel);
  draw(GRADIENT, velB); [velA, velB] = [velB, velA];
}

// the pointer stirs the fluid where it moves; the ring stirs a band across the screens while it travels
let px = -1, py = -1;
addEventListener('pointermove', e => {
  mx = e.clientX / innerWidth * 2 - 1;
  const x = e.clientX / innerWidth, y = 1 - e.clientY / innerHeight;
  if (px >= 0 && RING.live) splat(x, y, (x - px) * simW * 26, (y - py) * simH * 26, 0.0016);
  px = x; py = y;
});
function stirFromRing() {
  const v = RING.vel; if (Math.abs(v) < 3) return;
  for (let i = 0; i < 3; i++) splat(range(0.12, 0.88), range(0.36, 0.64), -v * 0.9, range(-0.2, 0.2) * v * 0.3, 0.006); // the screens drag the air with them
}

// ---------- size and loop ----------
let vwLast = 0, vhLast = 0;
function size() {
  const vw = innerWidth, vh = innerHeight; if (vw === vwLast && vh === vhLast) return; vwLast = vw; vhLast = vh;
  renderer.setPixelRatio(Math.min(1.5, devicePixelRatio || 1)); renderer.setSize(vw, vh, false);
  makeTargets(vw, vh);
}
let lastT = performance.now();
(function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(1 / 30, (now - lastT) / 1000); lastT = now;
  if (!RING.ready) return;
  size();
  const vw = vwLast, vh = vhLast;
  placeRing(vw, vh); placeClouds(vw, vh, dt);
  renderer.setRenderTarget(frameRT); renderer.clear();
  renderer.autoClear = false;
  renderer.render(ringScene, ringCam);
  renderer.clearDepth(); renderer.render(cloudScene, cloudCam);         // the clouds always sit in front of the screens
  renderer.autoClear = true;
  if (!REDUCED) { stirFromRing(); stepFluid(dt); }
  WARP.uniforms.uScene.value = frameRT.texture; WARP.uniforms.uVel.value = velA.texture;
  WARP.uniforms.uStrength.value = REDUCED ? 0 : 0.00012; WARP.uniforms.uBand.value = RING.band || 0;
  draw(WARP, null);
})(lastT);
</script>
